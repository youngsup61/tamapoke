<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TamaPoke Widget</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: rgba(20, 24, 40, 0.75);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #widget-card {
      width: 100%;
      height: 100%;
      border-radius: 24px;
      border: 1.5px solid rgba(255, 255, 255, 0.2);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 12px 16px;
      cursor: pointer;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #ffffff;
      z-index: 2;
    }
    .mon-name {
      font-weight: 700;
      font-size: 15px;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }
    .mon-lv {
      font-size: 13px;
      background: rgba(232, 80, 58, 0.85);
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: bold;
    }
    .canvas-wrap {
      flex: 1;
      width: 100%;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas#stage {
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
    }
    .bars {
      display: flex;
      gap: 6px;
      width: 100%;
      z-index: 2;
    }
    .bar-col {
      flex: 1;
      height: 5px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.3s ease;
    }
  </style>
</head>
<body onclick="location.href='index.html'">
  <div id="widget-card">
    <div class="header">
      <span class="mon-name" id="name">이상해씨</span>
      <span class="mon-lv" id="lv">Lv.1</span>
    </div>

    <div class="canvas-wrap">
      <canvas id="stage" width="280" height="180"></canvas>
    </div>

    <div class="bars">
      <div class="bar-col"><div class="bar-fill" id="bar-food" style="background:#e8503a; width:80%;"></div></div>
      <div class="bar-col"><div class="bar-fill" id="bar-joy" style="background:#e8a23c; width:80%;"></div></div>
      <div class="bar-col"><div class="bar-fill" id="bar-ene" style="background:#58b868; width:80%;"></div></div>
      <div class="bar-col"><div class="bar-fill" id="bar-hyg" style="background:#4f93c4; width:100%;"></div></div>
    </div>
  </div>

  <script src="js/dex.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/pak_loader.js"></script>
  <script src="js/engine.js"></script>
  <script>
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;

    let petX = 140;
    let targetX = 140;
    let act = 0; // 0: Idle, 1: WalkL, 2: WalkR
    let nextChange = Date.now() + 2000;
    let monData = null;

    async function initWidget() {
      initLanguage();
      pet.begin();

      const nameEl = document.getElementById('name');
      const lvEl = document.getElementById('lv');
      const species = pet.isEgg() ? 1 : pet.speciesId;
      nameEl.textContent = pet.nick || getDexName(species, 'ko');
      lvEl.textContent = `Lv.${pet.level() || 1}`;

      document.getElementById('bar-food').style.width = pet.fullness + '%';
      document.getElementById('bar-joy').style.width = pet.joy + '%';
      document.getElementById('bar-ene').style.width = pet.energy + '%';
      document.getElementById('bar-hyg').style.width = pet.hygiene + '%';

      await pakLoader.init();
      monData = pakLoader.loadMon(species, pet.shiny);

      function loop() {
        renderWidget();
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);
    }

    function renderWidget() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const groundY = 155;
      // Soft grass line
      ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
      ctx.fillRect(20, groundY, canvas.width - 40, 2);

      const now = Date.now();
      if (now > nextChange) {
        if (pet.sleeping) {
          act = 3;
        } else {
          const r = Math.random();
          if (r < 0.4) {
            act = 0; // Idle
          } else if (r < 0.7) {
            act = 1; // WalkL
            targetX = Math.max(70, petX - 40);
          } else {
            act = 2; // WalkR
            targetX = Math.min(210, petX + 40);
          }
        }
        nextChange = now + 1500 + Math.random() * 2000;
      }

      if (act === 1 && petX > targetX) petX -= 0.6;
      if (act === 2 && petX < targetX) petX += 0.6;

      if (monData) {
        let actObj = monData.acts.get(act) || monData.acts.get(0);
        if (actObj && actObj.frames.length > 0) {
          const fIdx = Math.floor((now / 150) % actObj.frames.length);
          const fr = actObj.frames[fIdx];
          const scale = 2.0;
          const sw = fr.w * scale;
          const sh = fr.h * scale;
          const sx = petX - sw / 2;
          const sy = groundY - fr.lowestRow * scale;
          ctx.drawImage(fr.canvas, sx, sy, sw, sh);
        }
      }

      // Poop icon
      if (pet.poops > 0) {
        ctx.fillStyle = '#8a5524';
        ctx.beginPath();
        ctx.arc(45, groundY - 8, 6, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    window.addEventListener('DOMContentLoaded', initWidget);
  </script>
</body>
</html>
